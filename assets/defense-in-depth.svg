     Hand-written SVG: edit the text, then check it renders (e.g. rsvg-convert). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>glovebox defense in depth: host, VM, accounts, container</title>
  <style>
    .t { font-size: 18px; fill: #222; }
    .s { font-size: 14px; fill: #444; }
    .b { font-weight: bold; }
    .g { font-size: 14px; fill: #1f3d66; }
    .lbl { font-size: 14px; fill: #333; }
    .arr { stroke: #444; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>

  <rect width="1100" height="820" fill="#fff"/>

  <!-- Host -->
  <rect x="20" y="20" width="1060" height="780" rx="14" fill="#dbe9fd" stroke="#4a90e2" stroke-width="2.5"/>
  <text x="44" y="54" class="t b">Host</text>
  <text x="96" y="54" class="s">your credentials and files · runs only terminals, browsers, editor UIs</text>

  <rect x="700" y="76" width="350" height="70" rx="8" fill="#fff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="875" y="106" class="t" text-anchor="middle">Terminals · browsers ·</text>
  <text x="875" y="130" class="t" text-anchor="middle">editor UIs</text>

  <text x="44" y="92" class="g b">Guards on the host, around every VM:</text>
  <text x="44" y="115" class="g">· firewall: egress mode by IP, Squid allowlists, private_allow; no inbound</text>
  <text x="44" y="136" class="g">· clean-traffic: no IP/MAC/ARP spoofing</text>
  <text x="44" y="157" class="g">· QEMU unprivileged, under seccomp (check verifies it); no emulated devices</text>
  <text x="56" y="178" class="g">(no graphics, USB, sound, TPM, CD-ROM), no nested virtualization,</text>
  <text x="56" y="199" class="g">no memory page sharing (KSM)</text>

  <!-- VM -->
  <rect x="50" y="260" width="1000" height="510" rx="12" fill="#fff3c4" stroke="#d98200" stroke-width="2.5"/>
  <text x="74" y="294" class="t b">glovebox VM</text>
  <text x="214" y="294" class="s">hardware virtualization (KVM) · kernel lockdown · hardened sysctls · IPv4 only</text>

  <!-- Your account -->
  <rect x="80" y="320" width="300" height="200" rx="10" fill="#fff" stroke="#8a6d3b" stroke-width="2"/>
  <text x="230" y="354" class="t b" text-anchor="middle">Your account</text>
  <text x="230" y="378" class="s" text-anchor="middle">(user)</text>
  <text x="230" y="412" class="s" text-anchor="middle">sudo, with a password</text>
  <text x="230" y="434" class="s" text-anchor="middle">administration only</text>
  <text x="230" y="468" class="s" text-anchor="middle">home 0700: closed to the agent</text>

  <!-- Agent account -->
  <rect x="420" y="320" width="600" height="420" rx="10" fill="#fff" stroke="#8a6d3b" stroke-width="2"/>
  <text x="720" y="354" class="t b" text-anchor="middle">Agent account</text>
  <text x="720" y="378" class="s" text-anchor="middle">(agent_user) · no sudo · no password · no privileged groups</text>

  <rect x="450" y="400" width="540" height="90" rx="8" fill="#f4f7fb" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="720" y="432" class="t" text-anchor="middle">AI agents + MCP servers · editors + extensions</text>
  <text x="720" y="460" class="t" text-anchor="middle">and any other dev tools</text>

  <!-- Container -->
  <rect x="450" y="515" width="540" height="200" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2.5"/>
  <text x="720" y="547" class="t b" text-anchor="middle">Container</text>
  <text x="720" y="570" class="s" text-anchor="middle">rootless, e.g. podman (yours to set up) · kernel namespaces</text>
  <rect x="560" y="592" width="320" height="95" rx="8" fill="#fde4e4" stroke="#d32f2f" stroke-width="2"/>
  <text x="720" y="632" class="t" text-anchor="middle">Untrusted code</text>
  <text x="720" y="660" class="t" text-anchor="middle">+ its dependencies</text>

  <!-- SSH from the host -->
  <path d="M980,146 L980,398" class="arr" marker-end="url(#a)"/>
  <text x="970" y="228" class="lbl" text-anchor="end">SSH / HTTP(S) as the agent</text>
  <path d="M720,146 L720,228 L240,228 L240,318" class="arr" marker-end="url(#a)"/>
  <text x="252" y="252" class="lbl">SSH as you (admin)</text>

  <text x="74" y="580" class="s">Each layer has to be broken</text>
  <text x="74" y="600" class="s">to reach the next one out:</text>
  <text x="74" y="625" class="s">untrusted code → container →</text>
  <text x="74" y="645" class="s">agent account (no root) →</text>
  <text x="74" y="665" class="s">guest kernel (lockdown) →</text>
  <text x="74" y="685" class="s">QEMU/KVM (seccomp) → host,</text>
  <text x="74" y="705" class="s">while the firewall limits what</text>
  <text x="74" y="725" class="s">any of them can send out.</text>
</svg>
