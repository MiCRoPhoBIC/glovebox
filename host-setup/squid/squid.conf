# Squid for glovebox: the outbound proxy for proxy-only sandboxes (the
# proxy_internet set in host-setup/nftables/glovebox.conf). A complete
# /etc/squid/squid.conf for a Squid that serves only the sandboxes. Check with
# `sudo squid -k parse`, apply with `sudo squid -k reconfigure`.
#
# TLS is inspected (ssl_bump) so the domain allowlist also holds inside HTTPS:
# a request whose Host doesn't match the TLS name is refused
# (host_verify_strict), which stops domain fronting. The CA's public
# certificate (sandboxCA.crt) is what create installs in the guest (proxy_ca
# in the config); its key (sandboxCA.pem) never leaves the host.

# Listen on the bridge address only, never on the host's other interfaces.
# Must match PROXY_ADDR/PROXY_PORT in the nftables ruleset. Squid fails to
# start if the bridge isn't up yet: start it after the libvirt network.
http_port 10.248.0.254:3128 ssl-bump \
  tls-cert=/etc/squid/ssl_cert/sandboxCA.pem \
  generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/cache/squid/ssl_db -M 4MB

acl sandbox_net src 10.248.0.0/24

# -n: match only the name in the request. Without it, a request to an IP
# address is matched by that IP's reverse DNS (PTR) name, which whoever owns
# the address chooses: an attacker's server could claim an allowlisted name
# and get plain HTTP through.
# Allowed for good: what the sandboxes need to work (e.g. the Claude API).
acl allowed_domains dstdomain -n "/etc/squid/allowed_domains.txt"
# Allowed while provisioning: package mirrors, installers. Comment its entries
# out (the file must stay) and reconfigure once the sandboxes are set up.
acl provision_domains dstdomain -n "/etc/squid/provision_domains.txt"

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow sandbox_net allowed_domains
http_access allow sandbox_net provision_domains
http_access deny all

acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump allowed_domains
ssl_bump bump provision_domains
ssl_bump terminate all

host_verify_strict on
cache deny all
forwarded_for delete
via off
# Default "squid" format: glovebox squid-denied parses it.
access_log stdio:/var/log/squid/access.log
