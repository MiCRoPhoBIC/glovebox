# forward_guard (optional): host-setup nftables asks whether to install it
# when nothing else on the host filters forwarded traffic, or takes
# --forward-guard / --no-forward-guard. Installed as
# /etc/glovebox/forward-guard.d/forward-guard.conf, which glovebox.conf
# includes.
#
# The sandboxes need net.ipv4.ip_forward=1, which lets the host route IPv4
# between all its interfaces, not only for them. This table limits
# forwarding to the sandbox bridge again: IPv4 that neither comes from nor
# goes to it is dropped. IPv6 forwarding, which glovebox doesn't turn on,
# is left alone.
#
# Unlike glovebox.conf, this touches traffic other than the sandboxes': a
# drop here wins over any accept elsewhere, so it also stops what Docker,
# other libvirt NAT networks or VPN routing on this host forward. Turn it
# off for those: ./glovebox host-setup nftables --no-forward-guard

table ip glovebox_guard
delete table ip glovebox_guard

define GUARD_DEV = "br-glovebox"

table ip glovebox_guard {
    chain forward {
        type filter hook forward priority filter; policy accept;
        iifname != $GUARD_DEV oifname != $GUARD_DEV drop # The host forwards IPv4 only to and from the sandboxes
    }
}
